<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torneo Futbol - Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Space Grotesk',sans-serif}
body{background:#0a0a0a;color:#fff;padding:14px;padding-bottom:90px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #1a1a1a}
.logo{font-weight:800;font-size:21px;letter-spacing:-0.5px}.logo span{color:#c8ff00}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;border-radius:30px;border:1px solid #262626;background:#161616;color:#888;font-weight:700;font-size:12px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.tab.active{background:#c8ff00;color:#000;border-color:#c8ff00}
.card{background:#161616;border:1px solid #232323;border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{font-size:11px;color:#666;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
input,select{width:100%;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:12px;padding:11px;color:#fff;margin-bottom:8px;font-size:14px;outline:none}
input:focus,select:focus{border-color:#c8ff00}
.btn{width:100%;background:#c8ff00;color:#000;border:none;border-radius:12px;padding:13px;font-weight:800;font-size:14px;margin-bottom:8px;cursor:pointer}
.btn-dark{background:#1e1e1e;color:#fff;border:1px solid #2a2a2a}
.btn-outline{background:transparent;color:#c8ff00;border:1px solid #c8ff00}
.btn-small{padding:7px 10px;font-size:11px;width:auto;border-radius:8px}
.table-header,.table-row{display:grid;gap:6px;padding:10px 6px;font-size:13px;align-items:center}
.table-header{color:#555;font-size:10px;border-bottom:1px solid #222;text-transform:uppercase;letter-spacing:0.5px;font-weight:700}
.table-row{border-bottom:1px solid #151515}
.puntos{color:#c8ff00;font-weight:800;text-align:center;background:#c8ff0012;border-radius:6px;padding:3px 0}
.jugador-row{display:grid;grid-template-columns:1fr 46px 46px 46px 46px 28px;gap:4px;margin-bottom:6px;align-items:center}
.plantilla-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:600px){.plantilla-grid{grid-template-columns:1fr 1fr 1fr}}
.player-card{background:#1c1c1c;border:1px solid #232323;border-radius:16px;padding:12px;text-align:center;position:relative}
.player-card img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #c8ff00;margin-bottom:8px;background:#222}
.player-card .pos{font-size:10px;color:#888;text-transform:uppercase}
.player-card .team{font-size:11px;color:#c8ff00;font-weight:700;margin:2px 0}
.player-card .name{font-weight:700;font-size:13px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-stats{display:flex;justify-content:space-around;margin-top:8px;font-size:11px}
.player-stats span{background:#0f0f0f;padding:3px 6px;border-radius:6px}
.tag{background:#c8ff0015;color:#c8ff00;padding:3px 8px;border-radius:20px;font-size:10px;margin:2px;display:inline-block;border:1px solid #c8ff0020;font-weight:600}
.tag-asist{background:#00d4ff12;color:#00d4ff;border-color:#00d4ff20}
.tag-yellow{background:#ffcc0015;color:#ffcc00;border-color:#ffcc0020}
.tag-red{background:#ff333315;color:#ff5555;border-color:#ff333320}
.empty{color:#444;text-align:center;padding:30px 10px;font-size:13px;line-height:1.5}
.photo-upload{width:80px;height:80px;border-radius:50%;border:2px dashed #333;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:#0f0f0f;margin:0 auto 10px}
.photo-upload img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="header"><div class="logo">TORNEO <span>FUTBOL</span></div><div style="width:36px;height:36px;background:#c8ff00;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:800">T</div></div>
<div class="tabs">
<button class="tab active" onclick="switchTab('tabla',this)">Tabla</button>
<button class="tab" onclick="switchTab('plantilla',this)">Plantilla</button>
<button class="tab" onclick="switchTab('goleadores',this)">Goles</button>
<button class="tab" onclick="switchTab('partidos',this)">Partidos</button>
<button class="tab" onclick="switchTab('equipos',this)">Equipos</button>
<button class="tab" onclick="switchTab('export',this)">Exportar</button>
</div>
<div id="v-tabla"><div id="tablaCard" style="background:#111;border-radius:18px;padding:12px;border:1px solid #1e1e1e"></div></div>
<div id="v-plantilla" style="display:none">
<div class="card">
<h3>Nuevo Jugador</h3>
<div style="display:flex;gap:12px;flex-direction:column;align-items:center">
<div class="photo-upload" onclick="document.getElementById('fotoInput').click()" id="photoPreview"><span style="font-size:24px;color:#444">+</span></div>
<input type="file" id="fotoInput" accept="image/*" style="display:none" onchange="previewFoto(this)">
</div>
<input id="jugNombre" placeholder="Nombre del jugador">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<select id="jugEquipo"></select>
<select id="jugPos"><option>Delantero</option><option>Mediocampista</option><option>Defensa</option><option>Portero</option></select>
</div>
<input id="jugNumero" type="number" placeholder="Número (ej: 10)">
<button class="btn" onclick="addJugador()">Agregar a Plantilla</button>
</div>
<div id="plantillaGrid" class="plantilla-grid"></div>
</div>
<div id="v-goleadores" style="display:none"><div id="goleadoresCard" style="background:#111;border-radius:18px;padding:12px;border:1px solid #1e1e1e"></div><div id="tarjetasCard" style="background:#111;border-radius:18px;padding:12px;border:1px solid #1e1e1e;margin-top:12px"></div></div>
<div id="v-partidos" style="display:none">
<div class="card">
<h3>Nuevo Partido Completo</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><select id="localSel"></select><select id="visitSel"></select></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="gLocal" type="number" placeholder="Goles Local" min="0"><input id="gVisit" type="number" placeholder="Goles Visita" min="0"></div>
<div style="margin-top:14px;border-top:1px solid #222;padding-top:14px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-size:12px;color:#c8ff00;font-weight:700">Estadísticas</span><button class="btn btn-small btn-outline" onclick="addStatRow()">+ Jugador</button></div>
<div style="display:grid;grid-template-columns:1fr 40px 40px 36px 36px 28px;gap:4px;margin-bottom:8px;font-size:9px;color:#555;font-weight:700"><div>JUGADOR</div><div>GOL</div><div>ASIS</div><div>🟨</div><div>🟥</div><div></div></div>
<div id="statsInputs"></div>
</div>
<button class="btn" onclick="addPartido()" style="margin-top:16px">Guardar Partido</button>
</div>
<div class="card"><h3>Historial</h3><div id="listaPartidos"></div></div>
</div>
<div id="v-equipos" style="display:none">
<div class="card"><h3>Nuevo Equipo</h3><input id="newTeam" placeholder="Nombre del equipo"><button class="btn" onclick="addEquipo()">Agregar Equipo</button></div>
<div class="card"><h3>Equipos Registrados</h3><div id="listaEquipos"></div></div>
</div>
<div id="v-export" style="display:none"><div class="card"><h3>Exportar Resultados</h3><button class="btn" onclick="exportarExcelBonito()">Exportar a Excel</button><button class="btn btn-dark" onclick="exportarPDFBonito()">Exportar a PDF</button></div></div>
<script>
let equipos=JSON.parse(localStorage.getItem('equipos_final')||'[]');
let partidos=JSON.parse(localStorage.getItem('partidos_final')||'[]');
let plantilla=JSON.parse(localStorage.getItem('plantilla_final')||'[]');
let tempFoto='';
function save(){localStorage.setItem('equipos_final',JSON.stringify(equipos));localStorage.setItem('partidos_final',JSON.stringify(partidos));localStorage.setItem('plantilla_final',JSON.stringify(plantilla));render()}
function switchTab(v,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');['tabla','plantilla','goleadores','partidos','equipos','export'].forEach(id=>{document.getElementById('v-'+id).style.display=id==v?'block':'none'})}
function previewFoto(input){if(input.files&&input.files[0]){let reader=new FileReader();reader.onload=function(e){tempFoto=e.target.result;document.getElementById('photoPreview').innerHTML=`<img src="${tempFoto}">`};reader.readAsDataURL(input.files[0])}}
function addEquipo(){let n=document.getElementById('newTeam').value.trim();if(!n)return;if(equipos.includes(n)){alert('Ya existe');return}equipos.push(n);document.getElementById('newTeam').value='';save()}
function addJugador(){
  let nombre=document.getElementById('jugNombre').value.trim();
  let equipo=document.getElementById('jugEquipo').value;
  let pos=document.getElementById('jugPos').value;
  let numero=document.getElementById('jugNumero').value;
  if(!nombre){alert('Pon nombre');return}
  if(!equipo){alert('Selecciona equipo');return}
  plantilla.push({id:Date.now(),nombre,equipo,pos,numero,foto:tempFoto||''});
  document.getElementById('jugNombre').value='';document.getElementById('jugNumero').value='';tempFoto='';document.getElementById('photoPreview').innerHTML='<span style="font-size:24px;color:#444">+</span>';document.getElementById('fotoInput').value='';save();
}
function addStatRow(){
  if(plantilla.length===0){alert('Primero agrega jugadores en Plantilla');switchTab('plantilla',document.querySelectorAll('.tab')[1]);return}
  let div=document.createElement('div');div.className='jugador-row';
  let opts=plantilla.map(j=>`<option value="${j.id}">${j.nombre} (${j.equipo})</option>`).join('');
  div.innerHTML=`<select><option value="">Jugador</option>${opts}</select><input type="number" placeholder="0" min="0"><input type="number" placeholder="0" min="0"><input type="number" placeholder="0" min="0"><input type="number" placeholder="0" min="0"><span onclick="this.parentElement.remove()" style="color:#444;cursor:pointer;text-align:center">✕</span>`;
  document.getElementById('statsInputs').appendChild(div);
}
function addPartido(){
  let l=document.getElementById('localSel').value,v=document.getElementById('visitSel').value,gl=parseInt(document.getElementById('gLocal').value),gv=parseInt(document.getElementById('gVisit').value);
  if(!l||!v){alert('Selecciona equipos');return}if(l==v){alert('Mismo equipo no');return}if(isNaN(gl)||isNaN(gv)){alert('Goles');return}
  let stats=[];
  document.querySelectorAll('#statsInputs .jugador-row').forEach(r=>{
    let id=r.children[0].value; let gol=parseInt(r.children[1].value)||0; let asi=parseInt(r.children[2].value)||0; let ama=parseInt(r.children[3].value)||0; let roja=parseInt(r.children[4].value)||0;
    if(id && (gol>0||asi>0||ama>0||roja>0)){
      let jug=plantilla.find(j=>j.id==id);
      stats.push({id:parseInt(id),nombre:jug?jug.nombre:'',equipo:jug?jug.equipo:'',goles:gol,asistencias:asi,amarillas:ama,rojas:roja})
    }
  });
  partidos.push({local:l,visit:v,gL:gl,gV:gv,stats,fecha:new Date().toLocaleDateString()});
  document.getElementById('gLocal').value='';document.getElementById('gVisit').value='';document.getElementById('statsInputs').innerHTML='';save();
}
function calc(){let t={};equipos.forEach(e=>t[e]={pj:0,gf:0,gc:0,pts:0});partidos.forEach(p=>{if(!t[p.local])t[p.local]={pj:0,gf:0,gc:0,pts:0};if(!t[p.visit])t[p.visit]={pj:0,gf:0,gc:0,pts:0};t[p.local].pj++;t[p.visit].pj++;t[p.local].gf+=p.gL;t[p.local].gc+=p.gV;t[p.visit].gf+=p.gV;t[p.visit].gc+=p.gL;if(p.gL>p.gV)t[p.local].pts+=3;else if(p.gL<p.gV)t[p.visit].pts+=3;else{t[p.local].pts+=1;t[p.visit].pts+=1}});let arr=Object.entries(t).map(([n,d])=>({nombre:n,...d,dif:d.gf-d.gc}));arr.sort((a,b)=>b.pts!=a.pts?b.pts-a.pts:b.dif-a.dif);return arr}
function calcStats(){
  let map={};
  plantilla.forEach(j=>{map[j.id]={...j,goles:0,asistencias:0,amarillas:0,rojas:0}});
  partidos.forEach(p=>{(p.stats||[]).forEach(s=>{
    if(!map[s.id]) map[s.id]={id:s.id,nombre:s.nombre,equipo:s.equipo,foto:'',goles:0,asistencias:0,amarillas:0,rojas:0};
    map[s.id].goles+=s.goles||0;map[s.id].asistencias+=s.asistencias||0;map[s.id].amarillas+=s.amarillas||0;map[s.id].rojas+=s.rojas||0;
  })});
  return Object.values(map);
}
function render(){
  document.getElementById('jugEquipo').innerHTML=equipos.length?equipos.map(e=>`<option>${e}</option>`).join(''):`<option value="" disabled>Agrega equipos primero</option>`;
  document.getElementById('localSel').innerHTML=equipos.length?equipos.map(e=>`<option>${e}</option>`).join(''):`<option disabled>Agrega equipos</option>`;
  document.getElementById('visitSel').innerHTML=document.getElementById('localSel').innerHTML;
  document.getElementById('listaEquipos').innerHTML=equipos.length?equipos.map((e,i)=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1a1a1a"><span><b>${i+1}.</b> ${e} <small style="color:#666">(${plantilla.filter(j=>j.equipo===e).length} jugadores)</small></span><span onclick="if(confirm('Eliminar?')){equipos.splice(${i},1);save()}" style="color:#333;cursor:pointer">✕</span></div>`).join(''):`<div class="empty">No hay equipos</div>`;
  let statsMap={};calcStats().forEach(s=>{statsMap[s.id]=s});
  document.getElementById('plantillaGrid').innerHTML=plantilla.length?plantilla.map(j=>{
    let s=statsMap[j.id]||{goles:0,asistencias:0,amarillas:0,rojas:0};
    let foto=j.foto?`<img src="${j.foto}">`:`<div style="width:64px;height:64px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 8px">👤</div>`;
    return `<div class="player-card"><div style="position:absolute;top:6px;right:8px;color:#333;cursor:pointer" onclick="if(confirm('Eliminar jugador?')){plantilla=plantilla.filter(x=>x.id!=${j.id});save()}">✕</div>${foto}<div class="name">${j.nombre}</div><div class="team">${j.equipo}</div><div class="pos">#${j.numero||'-'} • ${j.pos}</div><div class="player-stats"><span>⚽${s.goles}</span><span>🅰️${s.asistencias}</span><span style="color:#ffcc00">🟨${s.amarillas}</span><span style="color:#ff5555">🟥${s.rojas}</span></div></div>`
  }).join(''):`<div class="empty" style="grid-column:1/-1">No hay jugadores<br>Agrega tu plantilla</div>`;
  document.getElementById('listaPartidos').innerHTML=partidos.length?partidos.map((p,i)=>{
    let tags=(p.stats||[]).map(s=>{
      let t=''; if(s.goles>0)t+=`<span class="tag">⚽ ${s.nombre} ${s.goles}</span>`;
      if(s.asistencias>0)t+=`<span class="tag tag-asist">🅰️ ${s.nombre} ${s.asistencias}</span>`;
      if(s.amarillas>0)t+=`<span class="tag tag-yellow">🟨 ${s.nombre} ${s.amarillas}</span>`;
      if(s.rojas>0)t+=`<span class="tag tag-red">🟥 ${s.nombre} ${s.rojas}</span>`;
      return t;
    }).join('');
    return `<div class="match-row"><div style="display:flex;justify-content:space-between;width:100%"><span><b>${p.local}</b> ${p.gL}-${p.gV} <b>${p.visit}</b></span><div><small style="color:#444">${p.fecha}</small> <span onclick="partidos.splice(${i},1);save()" style="color:#333;margin-left:8px;cursor:pointer">✕</span></div></div>${tags?`<div style="margin-top:8px">${tags}</div>`:''}</div>`
  }).join(''):`<div class="empty">No hay partidos</div>`;
  let tabla=calc();
  let h=tabla.length?`<div class="table-header" style="grid-template-columns:32px 1fr 32px 32px 40px 40px"><div>#</div><div>Equipo</div><div>PJ</div><div>GF</div><div>DIF</div><div>PTS</div></div>`:`<div class="empty">Agrega equipos</div>`;
  tabla.forEach((eq,i)=>{h+=`<div class="table-row" style="grid-template-columns:32px 1fr 32px 32px 40px 40px"><div style="${i<3?'color:#c8ff00;font-weight:800':''}">${i+1}</div><div style="font-weight:600">${eq.nombre}</div><div>${eq.pj}</div><div>${eq.gf}</div><div>${eq.dif>0?'+':''}${eq.dif}</div><div class="puntos">${eq.pts}</div></div>`});
  document.getElementById('tablaCard').innerHTML=tabla.length?`<div style="color:#c8ff00;font-size:11px;font-weight:800;margin-bottom:8px">${tabla.length} EQUIPOS • ${partidos.length} PARTIDOS</div>`+h:h;
  let allStats=calcStats();
  let goles=allStats.filter(s=>s.goles>0).sort((a,b)=>b.goles-a.goles);
  let hg=goles.length?`<div class="table-header" style="grid-template-columns:32px 44px 1fr 30px"><div>#</div><div></div><div>Jugador</div><div>Gol</div></div>`:`<div class="empty">Sin goleadores</div>`;
  goles.forEach((s,i)=>{let img=s.foto?`<img src="${s.foto}" style="width:28px;height:28px;border-radius:50%;object-fit:cover">`:`<div style="width:28px;height:28px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:12px">👤</div>`;hg+=`<div class="table-row" style="grid-template-columns:32px 44px 1fr 30px"><div>${i+1}</div><div>${img}</div><div><div style="font-weight:600">${s.nombre}</div><div style="font-size:10px;color:#c8ff00">${s.equipo}</div></div><div class="puntos">${s.goles}</div></div>`});
  document.getElementById('goleadoresCard').innerHTML=goles.length?`<div style="color:#c8ff00;font-size:11px;font-weight:800;margin-bottom:8px">GOLEADORES</div>`+hg:hg;
  let tarjetas=allStats.filter(s=>s.amarillas>0||s.rojas>0).sort((a,b)=>(b.amarillas+b.rojas*2)-(a.amarillas+a.rojas*2));
  let ht=tarjetas.length?`<div class="table-header" style="grid-template-columns:32px 44px 1fr 30px 30px"><div>#</div><div></div><div>Jugador</div><div>🟨</div><div>🟥</div></div>`:`<div class="empty">Sin tarjetas</div>`;
  tarjetas.forEach((s,i)=>{let img=s.foto?`<img src="${s.foto}" style="width:28px;height:28px;border-radius:50%">`:`👤`;ht+=`<div class="table-row" style="grid-template-columns:32px 44px 1fr 30px 30px"><div>${i+1}</div><div>${img}</div><div><div style="font-weight:600">${s.nombre}</div><div style="font-size:10px;color:#888">${s.equipo}</div></div><div style="color:#ffcc00;text-align:center;font-weight:800">${s.amarillas}</div><div style="color:#ff5555;text-align:center;font-weight:800">${s.rojas}</div></div>`});
  document.getElementById('tarjetasCard').innerHTML=`<div style="color:#ff5555;font-size:11px;font-weight:800;margin-bottom:8px">TARJETAS</div>`+ht;
}
function exportarExcelBonito(){
  if(equipos.length===0){alert('Agrega equipos');return}
  let tabla=calc();let stats=calcStats();
  let html=`<html xmlns:o="urn:schemas-microsoft-com:office:office"><head><meta charset="UTF-8"><style>.h{background:#c8ff00;font-weight:800}.p{background:#111;color:#c8ff00;font-weight:800}td{padding:8px;border:1px solid #ddd}</style></head><body><h2>TORNEO FUTBOL</h2><p>${new Date().toLocaleDateString()} | ${equipos.length} equipos | ${partidos.length} partidos | ${plantilla.length} jugadores</p><table><tr class="h"><td>#</td><td>Equipo</td><td>PJ</td><td>GF</td><td>GC</td><td>DIF</td><td>PTS</td></tr>`;
  tabla.forEach((e,i)=>{html+=`<tr><td>${i+1}</td><td>${e.nombre}</td><td>${e.pj}</td><td>${e.gf}</td><td>${e.gc}</td><td>${e.dif}</td><td class="p">${e.pts}</td></tr>`});html+=`</table><br><h3>PLANTILLA</h3><table><tr class="h"><td>Jugador</td><td>Equipo</td><td>Pos</td><td>#</td><td>Goles</td><td>Asist</td><td>Amarillas</td><td>Rojas</td></tr>`;
  stats.forEach(s=>{html+=`<tr><td>${s.nombre}</td><td>${s.equipo}</td><td>${s.pos||''}</td><td>${s.numero||''}</td><td>${s.goles}</td><td>${s.asistencias}</td><td>${s.amarillas}</td><td>${s.rojas}</td></tr>`});
  html+=`</table></body></html>`;
  let blob=new Blob([`\ufeff${html}`],{type:'application/vnd.ms-excel'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Torneo-Plantilla-${new Date().toISOString().slice(0,10)}.xls`;a.click();
}
function exportarPDFBonito(){
  if(equipos.length===0){alert('Agrega equipos');return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF();
  doc.setFillColor(200,255,0);doc.rect(0,0,210,18,'F');doc.setFontSize(14);doc.text('TORNEO FUTBOL',14,12);
  let tabla=calc();doc.autoTable({startY:22,head:[['#','Equipo','PJ','GF','GC','DIF','PTS']],body:tabla.map((e,i)=>[i+1,e.nombre,e.pj,e.gf,e.gc,e.dif,e.pts]),headStyles:{fillColor:[200,255,0],textColor:0}});
  let stats=calcStats();
  doc.addPage();doc.setFillColor(200,255,0);doc.rect(0,0,210,18,'F');doc.text('PLANTILLA Y ESTADISTICAS',14,12);
  doc.autoTable({startY:22,head:[['Jugador','Equipo','G','A','🟨','🟥']],body:stats.map(s=>[s.nombre,s.equipo,s.goles,s.asistencias,s.amarillas,s.rojas]),headStyles:{fillColor:[0,0,0]}});
  doc.save(`Torneo-Plantilla-${new Date().toISOString().slice(0,10)}.pdf`);
}
